services:
  db:
    image: postgres:16-alpine
    container_name: dashboard_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Keeps the container's own initdb locale predictable
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Host port is configurable so it won't clash with a local Postgres install
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything dropped in here runs once, on first boot of an empty volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Lightweight DB browser at http://localhost:8080 -- optional, remove if unwanted.
  adminer:
    image: adminer:4
    container_name: dashboard_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

volumes:
  pgdata:
    name: dashboard_pgdata
